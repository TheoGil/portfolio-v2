<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Théo Gil - Creative developer</title>
    <meta
      name="description"
      content="Building real-time, interactive graphics for the web, games and physical spaces."
    />
    <link rel="canonical" href="https://theogil.cool/" />
  </head>
  <body>
    <main>
      <!-- Intro -->
      <section class="intro flex flex-col align-center text-center">
        <!-- Intro title -->
        <p class="intro__title heading h3 flex flex-col">
          <span>Hello, I'm </span>
          <span class="its-a-me">Théo</span
          ><span class="visually-hidden">,&nbsp;</span>
          <span
            ><span aria-hidden="true">{&nbsp;</span>creative developer<span
              aria-hidden="true"
              >&nbsp;}</span
            ></span
          >
        </p>

        <!-- Portrait -->
        <div class="intro__portrait">
          <img
            src="./src/assets/images/theo-gil.webp"
            alt="A picture of me so you know I'm a human"
            loading="lazy"
            width="512"
            height="512"
          />
        </div>

        <!-- What I do -->
        <p class="heading p-lead intro__description">
          I build real-time interactive websites, games, and graphics for
          physical installations
        </p>
      </section>

      <!-- Selected work -->
      <section class="work text-center">
        <h2 class="work__title heading h2">Work</h2>
        <ol class="work__list flex flex-col align-center">
          <!-- Item -->
          <li class="work-item">
            <h3 class="heading h3">Captain Goosebumps</h3>
            <div class="work-item__video-wrapper">
              <video
                src="./src/assets/videos/captain-goosbumps-preview.mp4"
                loading="lazy"
                class="work-item__video"
                autoplay="autoplay"
                muted="muted"
                playsinline="playsinline"
                loop="loop"
              ></video>
            </div>
            <div class="heading h4">Game</div>
          </li>

          <!-- Item -->
          <li class="work-item">
            <h3 class="heading h3">Giga Game</h3>

            <div class="work-item__video-wrapper">
              <video
                src="./src/assets/videos/captain-goosbumps-preview.mp4"
                loading="lazy"
                class="work-item__video"
                autoplay="autoplay"
                muted="muted"
                playsinline="playsinline"
                loop="loop"
              ></video>
            </div>
            <div class="heading h4">Game</div>
          </li>

          <!-- Item -->
          <li class="work-item">
            <h3 class="heading h3">BEA BAU 2024</h3>

            <div class="work-item__video-wrapper">
              <video
                src="./src/assets/videos/captain-goosbumps-preview.mp4"
                loading="lazy"
                class="work-item__video"
                autoplay="autoplay"
                muted="muted"
                playsinline="playsinline"
                loop="loop"
              ></video>
            </div>
            <div class="heading h4">Physical installation</div>
          </li>

          <!-- Item -->
          <li class="work-item">
            <h3 class="heading h3">Red Bull (Un)serious Race</h3>

            <div class="work-item__video-wrapper">
              <video
                src="./src/assets/videos/captain-goosbumps-preview.mp4"
                loading="lazy"
                class="work-item__video"
                autoplay="autoplay"
                muted="muted"
                playsinline="playsinline"
                loop="loop"
              ></video>
            </div>
            <div class="heading h4">Game</div>
          </li>
        </ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
